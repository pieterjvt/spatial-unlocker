<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Spatial Scene Unlocker</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="./assets/css/index.css">
    </head>
    <body>
        <div class="container-xxl text-center mt-4">
            <h1>Spatial Scene Unlocker</h1>
            <p>Removes indicators from a screenshot to unlock iOS Spatial Scene, using just the browser.</p>
            <div class="container-sm mt-4">
                <div id="dropZone" class="border border-2 rounded text-center bg-light">
                    <span id="labelNormal">Drop or click to upload</span>
                    <span id="labelDragover">Drop here</span>

                    <input id="fileInput" type="file" accept=".heic,.jpeg,.jpg" multiple hidden>
                </div>
                <div id="fileControls" class="mt-3 d-flex gap-2">
                    <button type="button" class="btn btn-danger" onclick="clearFiles()" disabled>Clear</button>
                    <button type="button" class="btn btn-primary ms-auto" onclick="convertFiles()" disabled>Convert</button>
                    <button type="button" class="btn btn-primary" onclick="downloadFiles()" disabled>Save (converted)</button>
                </div>

                <ul id="fileList" class="list-group mt-3"></ul>            
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="./assets/js/functions.js"></script>
        <script src="./assets/js/app.js"></script>
    </body>
</html>
